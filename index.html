<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Щоденник</title>
<meta name="theme-color" content="#FBF8FF">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..800&display=swap&subset=cyrillic,cyrillic-ext,latin" rel="stylesheet">
<style>
  :root {
    --bg: #FBF8FF; --ink: #1B1B21; --sub: #46464F; --primary: #4355B9;
    --surf: #EEEDF4; --surf2: #E8E7EF; --nav: #F4F2FA;
    --chip: #DDE1FF; --chip-fg: #00164E;
    --pink: #FFD8EC; --pink-fg: #2E1126;
    --green: #BFEBDC; --green-fg: #00201A;
    --red: #FFDAD6; --red-fg: #410002;
    --yellow: #FFE18E; --yellow-fg: #241A00;
    --outline: #777680;
    --on-primary: #FFFFFF; --on-primary-sub: #E1E4FF; --card: #FFFFFF; --error: #BA1A1A;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; }
  button { font-family: inherit; cursor: pointer; }
  a { text-decoration: none; color: inherit; }
  svg { display: block; }
  .app { max-width: 480px; margin: 0 auto; min-height: 100vh; padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
  .hidden { display: none !important; }

  /* header */
  .hdr { display: flex; align-items: center; justify-content: space-between; padding: 20px 16px 8px 24px; gap: 8px; }
  .hdr h1 { margin: 0; font-size: 34px; line-height: 40px; font-weight: 800; letter-spacing: -0.5px; }
  .hdr h1.long { font-size: 26px; line-height: 32px; }
  .hdr .acts { display: flex; align-items: center; gap: 4px; }
  .ibtn { position: relative; width: 48px; height: 48px; border-radius: 24px; border: 0; background: none; color: var(--ink); display: flex; align-items: center; justify-content: center; padding: 0; }
  .ibtn.sq { width: 44px; height: 44px; border-radius: 16px; background: var(--surf2); }
  .ibtn .dot { position: absolute; top: 10px; right: 11px; width: 9px; height: 9px; border-radius: 50%; background: var(--primary); border: 2px solid var(--bg); }
  .lang { width: 52px; height: 44px; border-radius: 22px; border: 0; background: var(--primary); color: var(--on-primary); font-size: 15px; font-weight: 700; padding: 0; }
  .who { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 8px 0 24px; }
  .who .nm { min-width: 0; font-size: 17px; line-height: 22px; font-weight: 600; text-wrap: balance; }
  .page { padding: 12px 16px 20px; display: flex; flex-direction: column; gap: 12px; }

  /* week / month switcher */
  .switch { display: flex; gap: 4px; padding: 12px 16px 0; }
  .switch button { border: 0; height: 52px; color: var(--ink); background: var(--surf2); display: flex; align-items: center; justify-content: center; padding: 0; }
  .switch .prev { width: 60px; border-radius: 26px 8px 8px 26px; }
  .switch .next { width: 60px; border-radius: 8px 26px 26px 8px; }
  .switch .mid { flex: 1; border-radius: 8px; background: var(--chip); color: var(--chip-fg); font-size: 16px; font-weight: 700; }

  /* segmented */
  .seg { display: flex; gap: 4px; padding: 12px 16px 0; }
  .seg button { flex: 1; height: 48px; border: 0; font-size: 15px; font-weight: 600; background: var(--surf2); color: var(--ink); }
  .seg button:first-child { border-radius: 24px 8px 8px 24px; }
  .seg button:last-child { border-radius: 8px 24px 24px 8px; }
  .seg button.on { background: var(--primary); color: var(--on-primary); }

  /* day header */
  .dayh { display: flex; align-items: center; justify-content: space-between; padding: 4px 4px 0 12px; }
  .dayh .dn { font-size: 24px; line-height: 30px; font-weight: 700; }
  .dayh .dd { font-size: 14px; line-height: 20px; color: var(--sub); }
  .mood { width: 48px; height: 48px; border-radius: 16px; display: flex; align-items: center; justify-content: center; background: var(--green); color: var(--green-fg); }
  .mood.mid { background: var(--yellow); color: var(--yellow-fg); }
  .mood.low { background: var(--red); color: var(--red-fg); }

  /* lessons */
  .list { display: flex; flex-direction: column; gap: 2px; }
  .les { display: flex; gap: 12px; padding: 14px 6px 14px 14px; background: var(--surf); color: var(--ink); border-radius: 8px; }
  .les:first-child { border-radius: 28px 28px 8px 8px; }
  .les:last-child { border-radius: 8px 8px 28px 28px; }
  .les:only-child { border-radius: 28px; }
  .les.cur { background: var(--primary); color: var(--on-primary); }
  .badge { flex: none; width: 44px; height: 44px; border-radius: 16px; background: var(--chip); color: var(--chip-fg); display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; }
  .les.cur .badge { background: var(--on-primary); color: var(--primary); }
  .lbody { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; padding-top: 2px; }
  .lsub { font-size: 17px; line-height: 22px; font-weight: 600; overflow-wrap: anywhere; }
  .lmeta { font-size: 13px; line-height: 18px; color: var(--sub); }
  .les.cur .lmeta { color: var(--on-primary-sub); }
  .gr { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 10px; }
  .chipg { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 12px; border-radius: 12px; background: var(--chip); color: var(--chip-fg); font-size: 13px; font-weight: 500; }
  .chipg b { font-size: 16px; font-weight: 800; }
  .chipg.a { background: var(--pink); color: var(--pink-fg); }
  .chipg.t { background: var(--green); color: var(--green-fg); }
  .chipg.n { background: var(--red); color: var(--red-fg); }
  .expand { flex: none; align-self: flex-start; width: 44px; height: 44px; border-radius: 22px; border: 0; background: none; color: inherit; display: flex; align-items: center; justify-content: center; padding: 0; }
  .expand svg { transition: transform .2s; }
  .les.open .expand svg { transform: rotate(180deg); }
  .panel { display: none; margin-top: 12px; flex-direction: column; gap: 10px; padding: 12px 14px; border-radius: 16px; background: var(--bg); color: var(--ink); }
  .les.cur .panel { background: color-mix(in srgb, var(--on-primary) 16%, transparent); color: var(--on-primary); }
  .les.open .panel { display: flex; }
  .panel .k { font-size: 12px; line-height: 16px; font-weight: 600; color: var(--sub); }
  .les.cur .panel .k { color: var(--on-primary-sub); }
  .panel .v { font-size: 14px; line-height: 20px; white-space: pre-wrap; overflow-wrap: anywhere; }

  /* schedule */
  .days { display: flex; gap: 8px; padding: 12px 16px 0; }
  .dpill { flex: 1; border: 0; border-radius: 20px; background: var(--surf2); color: var(--ink); padding: 8px 0; display: flex; flex-direction: column; align-items: center; font-size: 13px; font-weight: 500; }
  .dpill b { font-size: 20px; font-weight: 700; }
  .dpill.on { background: var(--primary); color: var(--on-primary); }
  .srow { display: flex; align-items: center; gap: 12px; padding: 14px; background: var(--surf); border-radius: 8px; }
  .srow:first-child { border-radius: 28px 28px 8px 8px; }
  .srow:last-child { border-radius: 8px 8px 28px 28px; }
  .srow:only-child { border-radius: 28px; }
  .srow .tm { flex: none; text-align: right; font-size: 14px; line-height: 20px; font-weight: 500; }
  .break { display: flex; justify-content: space-between; align-items: center; padding: 18px 20px; border-radius: 24px; background: var(--yellow); color: var(--yellow-fg); font-size: 16px; font-weight: 700; margin: 8px 0; }
  .sblock { border-radius: 24px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .sblock .th { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 14px; }
  .sblock .th .badge { width: 32px; height: 32px; border-radius: 10px; font-size: 15px; background: rgba(255,255,255,.7); color: inherit; }
  .sblock .it .s { font-size: 17px; font-weight: 500; }
  .sblock .it .m { font-size: 13px; opacity: .8; }
  .c0 { background: var(--green); color: var(--green-fg); }
  .c1 { background: var(--chip); color: var(--chip-fg); }
  .c2 { background: var(--pink); color: var(--pink-fg); }
  .c3 { background: var(--yellow); color: var(--yellow-fg); }

  /* grades */
  .card { background: var(--surf); border-radius: 28px; padding: 16px; }
  .card h3 { margin: 4px 4px 12px; font-size: 18px; font-weight: 700; display: flex; justify-content: space-between; gap: 8px; }
  .card h3 small { font-size: 13px; font-weight: 600; color: var(--sub); align-self: center; white-space: nowrap; }
  .gtiles { display: flex; flex-wrap: wrap; gap: 8px; }
  .gt { min-width: 64px; padding: 10px 12px; border-radius: 16px; background: var(--card); display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .gt b { font-size: 24px; line-height: 28px; font-weight: 800; }
  .gt span { font-size: 13px; color: var(--sub); }
  .gt.a { background: var(--pink); } .gt.t { background: var(--green); } .gt.n { background: var(--red); }

  /* canteen */
  .bal { background: var(--primary); color: var(--on-primary); border-radius: 32px; padding: 20px 24px 24px; }
  .bal .l { font-size: 14px; opacity: .8; }
  .bal .n { font-size: 44px; line-height: 52px; font-weight: 800; margin-top: 6px; }
  .bal .n small { font-size: 22px; font-weight: 600; }
  .two { display: flex; gap: 12px; }
  .two > div { flex: 1; border-radius: 24px; padding: 16px; }
  .two .l { font-size: 14px; font-weight: 500; }
  .two .n { font-size: 20px; font-weight: 800; margin-top: 4px; }
  .filters { background: var(--surf); border-radius: 28px; padding: 18px 16px; display: flex; flex-direction: column; gap: 12px; }
  .filters h3 { margin: 0; font-size: 18px; }
  .frow { display: flex; gap: 12px; }
  .frow label { flex: 1; min-width: 0; font-size: 12px; color: var(--sub); display: flex; flex-direction: column; gap: 4px; }
  .filters > label { font-size: 12px; color: var(--sub); display: flex; flex-direction: column; gap: 4px; }
  .filters select { height: 52px; border: 1px solid var(--outline); border-radius: 14px; padding: 0 14px; font-size: 16px; background: transparent; color: var(--ink); font-family: inherit; width: 100%; }
  .frow input, .frow select { height: 52px; border: 1px solid var(--outline); border-radius: 14px; padding: 0 14px; font-size: 16px; background: transparent; color: var(--ink); font-family: inherit; min-width: 0; width: 100%; }
  .tx { background: var(--surf); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .tx:first-of-type { border-radius: 28px 28px 8px 8px; }
  .tx:last-of-type { border-radius: 8px 8px 28px 28px; }
  .tx .top { display: flex; align-items: center; gap: 12px; }
  .tx .ic { width: 48px; height: 48px; border-radius: 16px; background: var(--yellow); color: var(--yellow-fg); display: flex; align-items: center; justify-content: center; flex: none; }
  .tx .ic.in { background: var(--green); color: var(--green-fg); }
  .tx .tt { flex: 1; }
  .tx .tt b { display: block; font-size: 17px; }
  .tx .tt span { font-size: 13px; color: var(--sub); }
  .tx .am { font-size: 20px; font-weight: 800; }
  .tx .line { background: var(--card); border-radius: 14px; padding: 10px 14px; display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }

  /* more */
  .me { background: var(--chip); border-radius: 28px; padding: 16px; display: flex; align-items: center; gap: 16px; color: var(--chip-fg); }
  .me .av { width: 64px; height: 64px; border-radius: 20px; background: var(--primary); color: var(--on-primary); display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 700; flex: none; }
  .me b { font-size: 20px; line-height: 26px; display: block; }
  .mi { display: flex; align-items: center; gap: 16px; padding: 14px 16px; background: var(--surf); border: 0; width: 100%; text-align: left; font-size: 16px; font-weight: 600; color: var(--ink); border-radius: 8px; }
  .mi:first-child { border-radius: 28px 28px 8px 8px; }
  .mi:last-child { border-radius: 8px 8px 28px 28px; }
  .mi .ic { width: 48px; height: 48px; border-radius: 16px; background: var(--chip); color: var(--chip-fg); display: flex; align-items: center; justify-content: center; flex: none; }
  .mi .t { flex: 1; }
  .mi.out { background: var(--red); color: var(--red-fg); border-radius: 28px; margin-top: 8px; }
  .mi.out .ic { background: color-mix(in srgb, var(--bg) 60%, transparent); color: var(--red-fg); }

  /* feed */
  .fi { background: var(--surf); border-radius: 8px; padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start; }
  .fi:first-of-type { border-radius: 28px 28px 8px 8px; }
  .fi:last-of-type { border-radius: 8px 8px 28px 28px; }
  .fi .b { flex: 1; min-width: 0; }
  .fi .tm { font-size: 12px; color: var(--sub); }
  .fi .tt { font-size: 16px; font-weight: 600; margin-top: 2px; }
  .fi .ds { font-size: 13px; color: var(--sub); margin-top: 2px; overflow-wrap: anywhere; }
  .moreb { height: 48px; border: 0; border-radius: 24px; background: var(--chip); color: var(--chip-fg); font-size: 15px; font-weight: 700; }

  .marks { display: inline-flex; gap: 4px; vertical-align: middle; margin-left: 6px; }
  .mk { width: 22px; height: 22px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; background: var(--yellow); color: var(--yellow-fg); }
  .mk.cm { background: var(--pink); color: var(--pink-fg); }
  .les.cur .mk { background: var(--on-primary); color: var(--primary); }
  .gt { position: relative; }
  .gt .cdot { position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--primary); }
  .switch .mid { position: relative; gap: 8px; font-size: 15px; white-space: nowrap; }
  .switch .mid input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; border: 0; cursor: pointer; }
  .sblock .it { display: flex; align-items: center; gap: 10px; }
  .sblock .it .tx2 { flex: 1; min-width: 0; }
  .gbadge { flex: none; display: inline-flex; align-items: center; gap: 4px; background: rgba(255,255,255,.75); border-radius: 12px; padding: 4px 10px; font-size: 13px; font-weight: 700; }
  html[data-dark] .sblock { background: color-mix(in srgb, var(--sc) 32%, var(--surf)) !important; color: var(--ink) !important; }
  html[data-dark] .gbadge { background: color-mix(in srgb, var(--ink) 18%, transparent); color: var(--ink); }
  html[data-dark] .sblock .th .badge { background: color-mix(in srgb, var(--ink) 16%, transparent); }
  .sblock .sep { height: 1px; background: rgba(0,0,0,.08); }
  .tx .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .tx .chips span { background: var(--card); border-radius: 10px; padding: 4px 10px; font-size: 12px; color: var(--sub); }

  .copybtn { border: 0; border-radius: 16px; background: var(--chip); color: var(--chip-fg); font-size: 13px; font-weight: 700; padding: 8px 14px; margin: 8px 8px 0 0; }
  .toast { position: fixed; left: 50%; bottom: calc(100px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 12px 20px; border-radius: 16px; font-size: 14px; z-index: 50; max-width: 90%; text-align: center; }

  .look { background: var(--surf); border-radius: 28px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .look h3 { margin: 0 4px; font-size: 18px; font-weight: 700; }
  .look .lbl { font-size: 12px; color: var(--sub); margin: 0 4px 6px; font-weight: 600; }
  .look .seg { padding: 0; }
  .look .seg button { height: 44px; font-size: 14px; background: var(--surf2); }
  .look .seg button.on { background: var(--primary); color: var(--on-primary); }
  .sw { display: flex; flex-wrap: wrap; gap: 10px; padding: 0 2px; }
  .sw button, .sw label { width: 40px; height: 40px; border-radius: 50%; border: 3px solid transparent; padding: 0; position: relative; }
  .sw button.on { border-color: var(--ink); }
  .sw label { background: conic-gradient(#e53935, #fdd835, #43a047, #1e88e5, #8e24aa, #e53935); display: block; overflow: hidden; }
  .sw label.on { border-color: var(--ink); }
  .sw label input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }

  .files { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .file { display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px 8px; border-radius: 14px; background: var(--card); color: var(--ink); font-size: 13px; line-height: 18px; }
  .les.cur .file { background: color-mix(in srgb, var(--on-primary) 18%, transparent); color: var(--on-primary); }
  .file .fi2 { flex: none; width: 36px; height: 36px; border-radius: 10px; background: var(--chip); color: var(--chip-fg); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; text-transform: uppercase; }
  .file .fn { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .file .fs { display: block; font-size: 11px; opacity: .7; }
  .thumb { display: block; border-radius: 14px; overflow: hidden; background: var(--card); }
  .thumb img { display: block; width: 100%; max-height: 220px; object-fit: cover; }
  .thumb .cap { padding: 6px 12px 8px; font-size: 12px; opacity: .8; }
  .panel a.lk { color: inherit; text-decoration: underline; text-underline-offset: 2px; overflow-wrap: anywhere; }

  .lightbox { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.92); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; gap: 12px; }
  .lightbox img { max-width: 100%; max-height: 80vh; border-radius: 12px; object-fit: contain; }
  .lightbox .bar { display: flex; gap: 10px; }
  .lightbox button { border: 0; border-radius: 20px; background: var(--chip); color: var(--chip-fg); font-size: 14px; font-weight: 700; padding: 10px 18px; }
  .thumb .ph { display: flex; align-items: center; justify-content: center; height: 90px; font-size: 13px; opacity: .7; }

  .zoom { align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px 0 12px; border-radius: 18px; background: var(--primary); color: var(--on-primary); font-size: 14px; font-weight: 700; }
  .les.cur .zoom { background: var(--on-primary); color: var(--primary); }

  /* bottom nav */
  nav.bn { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; justify-content: center; background: var(--nav); }
  nav.bn .in { width: 100%; max-width: 480px; display: flex; align-items: flex-start; height: calc(80px + env(safe-area-inset-bottom)); padding: 12px 8px env(safe-area-inset-bottom); }
  nav.bn button { flex: 1; border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--sub); font-size: 12px; line-height: 16px; font-weight: 500; padding: 0; }
  nav.bn button .pill { width: 56px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center; }
  nav.bn button.on { color: var(--ink); font-weight: 700; }
  nav.bn button.on .pill { background: var(--chip); color: var(--chip-fg); }

  /* states */
  .msg { padding: 24px 16px; text-align: center; color: var(--sub); font-size: 14px; }
  .err { margin: 12px 16px; padding: 14px; border-radius: 16px; background: var(--red); color: var(--red-fg); font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .spin { margin: 40px auto; width: 32px; height: 32px; border-radius: 50%; border: 4px solid var(--chip); border-top-color: var(--primary); animation: sp .8s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  details.rawd { margin: 8px 16px; font-size: 12px; color: var(--sub); }
  details.rawd pre { background: var(--surf); padding: 10px; border-radius: 12px; white-space: pre-wrap; word-break: break-all; max-height: 260px; overflow: auto; }

  /* login */
  .login { max-width: 420px; margin: 0 auto; padding: 56px 24px 24px; }
  .login h1 { font-size: 40px; font-weight: 800; letter-spacing: -.5px; margin: 0 0 4px; }
  .login p { margin: 0 0 28px; color: var(--sub); }
  .login label.f { display: block; font-size: 12px; color: var(--sub); margin: 14px 0 4px 4px; }
  .login input[type=email], .login input[type=password], .login input[type=text] { width: 100%; height: 56px; border: 1px solid var(--outline); border-radius: 16px; padding: 0 16px; font-size: 16px; background: transparent; color: var(--ink); font-family: inherit; }
  .login input:focus { outline: 2px solid var(--primary); border-color: var(--primary); }
  .login .rem { display: flex; gap: 10px; align-items: center; margin: 16px 4px; font-size: 15px; }
  .login .go { width: 100%; height: 56px; border: 0; border-radius: 28px; background: var(--primary); color: var(--on-primary); font-size: 17px; font-weight: 700; }
  .login .go:disabled { opacity: .5; }
  .login .st { margin-top: 14px; font-size: 13px; white-space: pre-wrap; word-break: break-all; min-height: 18px; }
  .login .st.error { color: var(--error); }
  .login details { margin-top: 18px; font-size: 13px; color: var(--sub); }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login-view" class="login">
  <h1>Щоденник</h1>
  <p>Увійдіть у школу</p>
  <label class="f" for="email">Email</label>
  <input type="email" id="email" autocomplete="username" placeholder="you@example.com">
  <label class="f" for="password">Пароль</label>
  <input type="password" id="password" autocomplete="current-password">
  <label class="rem"><input type="checkbox" id="remember" checked> Запам'ятати мене</label>
  <button class="go" id="login-btn">Увійти</button>

  const hexToRgb = (h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
  function rgbToHsl([r, g, b]) {
    r /= 255; g /= 255; b /= 255;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b); let h = 0, s = 0; const l = (mx + mn) / 2;
    if (mx !== mn) {
      const d = mx - mn; s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
      h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h *= 60;
    }
    return [h, s * 100, l * 100];
  }
  const hsl = (h, s, l) => `hsl(${Math.round(h)} ${Math.round(s)}% ${Math.round(l)}%)`;

  function hslToRgb(h, s, l) {

    const f = (n) => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
    return [Math.round(f(0) * 255), Math.round(f(8) * 255), Math.round(f(4) * 255)];
  }

    const solid = dark

    if (dark) {
      return { ...common,
        "--bg": hsl(h, 14, 9), "--ink": hsl(h, 18, 90), "--sub": hsl(h, 10, 72), "--surf": hsl(h, 11, 15), "--surf2": hsl(h, 11, 20), "--nav": hsl(h, 13, 12),

  // ================= SCREEN: canteen =================
  const iso = (d) => `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`;
  const dmy = (d) => `${pad(d.getUTCDate())}.${pad(d.getUTCMonth() + 1)}.${d.getUTCFullYear()}`;
  function money(v) { const n = Number(v); return isNaN(n) ? String(v) : (Math.round(n * 100) / 100).toLocaleString("uk-UA", { maximumFractionDigits: 2 }); }

  async function canteen() {
    const root = $("screen"); root.innerHTML = "";
    const page = el("div", "page"); root.appendChild(page);
    const bal = el("div", "bal");
    bal.appendChild(el("div", "l", "Баланс"));
    const n = el("div", "n"); const b = S.profile && S.profile.canteen_balance;
    n.textContent = b != null ? money(b) + " " : "—"; n.appendChild(el("small", null, "грн."));
    bal.appendChild(n); page.appendChild(bal);
    const sums = el("div", "two"); page.appendChild(sums);

    const now = new Date();
    if (!S.to) S.to = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
    if (!S.from) S.from = S.to - 60 * DAY;
    const f = el("div", "filters"); f.appendChild(el("h3", null, "Діапазон дат"));
    const row = el("div", "frow");
    const mk = (lbl, val, cb) => { const l = el("label", null, lbl); const i = document.createElement("input"); i.type = "date"; i.value = iso(new Date(val)); i.onchange = () => { if (i.value) { cb(Date.parse(i.value + "T00:00:00Z")); canteen(); } }; l.appendChild(i); return l; };
    row.append(mk("Від", S.from, (v) => (S.from = v)), mk("До", S.to, (v) => (S.to = v)));
    f.appendChild(row);
    const tl = el("label", null, "Тип транзакції"); const sel = document.createElement("select");
    [["all", "Всі"], ["in", "Надходження"], ["out", "Трати"]].forEach(([v, t]) => { const o = el("option", null, t); o.value = v; if (S.ctype === v) o.selected = true; sel.appendChild(o); });
    sel.onchange = () => { S.ctype = sel.value; canteen(); }; tl.appendChild(sel); f.appendChild(tl);
    page.appendChild(f);
    const listBox = el("div"); page.appendChild(listBox); listBox.appendChild(el("div", "spin"));

    // endpoint date format isn't known -> try a few
    const id = S.studentId; let json = null, lastErr = null;
    const fmts = [(d) => iso(d), (d) => dmy(d), (d) => String(d.getTime())];
    for (const fm of fmts) {
      try {
        const p = `/canteen/get/${id}/${fm(new Date(S.from))}/${fm(new Date(S.to))}`;
        json = await api(`/api?path=${encodeURIComponent(p)}`); break;
      } catch (e) { lastErr = e; }
    }
    if (S.screen !== "canteen") return;
    listBox.innerHTML = "";
    if (!json) return errorBox(listBox, lastErr);
    const pc = parseCanteen(json);
    if (pc.balance != null) { n.firstChild.textContent = money(pc.balance) + " "; }
    if (pc.card) bal.firstChild.textContent = `Баланс · Картка №${pc.card}`;
    const inRange = (t) => !t.dateObj || (t.dateObj.getTime() >= S.from && t.dateObj.getTime() <= S.to);
    const tx = pc.tx.filter(inRange);
    if (!tx.length) { listBox.appendChild(el("div", "msg", "Транзакцій за цей період немає.")); return rawBox(listBox, json); }
    let income = 0, spend = 0;
    const shown = tx.filter((t) => S.ctype === "all" || (S.ctype === "in") === (t.amount > 0));
    tx.forEach((t) => (t.amount > 0 ? (income += t.amount) : (spend += t.amount)));
    const a = el("div"); a.style.cssText = "background:var(--green);color:var(--green-fg)"; a.append(el("div", "l", "Надходження"), el("div", "n", money(income) + " грн."));
    const bb = el("div"); bb.style.cssText = "background:var(--yellow);color:var(--yellow-fg)"; bb.append(el("div", "l", "Трати"), el("div", "n", money(spend) + " грн."));
    sums.append(a, bb);
    shown.forEach((t) => {
      const c = el("div", "tx"); const top = el("div", "top");
      const ic = el("div", "ic" + (t.amount > 0 ? " in" : "")); ic.appendChild(svg(t.amount > 0 ? ICON.plus : ICON.dish));
      const tt = el("div", "tt"); tt.append(el("b", null, t.amount > 0 ? "Надходження" : "Трати"), el("span", null, t.date));
      top.append(ic, tt, el("div", "am", (t.amount > 0 ? "+" : "−") + money(Math.abs(t.amount)) + " грн."));
      c.appendChild(top);
      t.lines.forEach((ln) => { const r = el("div", "line"); r.append(el("span", null, ln.name), el("span", null, ln.qty)); c.appendChild(r); });
      if (!t.lines.length && t.extra && t.extra.length) { const ch = el("div", "chips"); t.extra.forEach((v) => ch.appendChild(el("span", null, v))); c.appendChild(ch); }
      listBox.appendChild(c);
    });
    rawBox(listBox, json);
  }
  const NAME_KEYS = ["name", "title", "product", "product_name", "dish", "dish_name", "good", "goods_name", "item", "description", "text"];
  // any nested list of things bought (names + qty/price), whatever it's called
  function collectLines(x) {
    const out = [];
    (function walk(o, depth) {
      if (!o || depth > 4) return;
      if (Array.isArray(o)) {
        o.forEach((it) => {
          if (it && typeof it === "object") {
            const nm = pick(it, NAME_KEYS);
            if (nm != null && typeof nm !== "object") {
              out.push({ name: String(nm), qty: [pick(it, ["quantity", "qty", "count", "amount_items", "amount"]), pick(it, ["price", "cost", "sum", "total"])].filter((v) => v != null).join(" × ") });
              return;
            }
            walk(it, depth + 1);
          }
        });
      } else if (typeof o === "object") for (const k in o) walk(o[k], depth + 1);
    })(Object.fromEntries(Object.entries(x).filter(([, v]) => v && typeof v === "object")), 0);
    return out;
  }
  // other readable text fields of the transaction (place, comment, check no...)
  function collectExtra(x) {
    const skip = /^(id|.*_id|amount|sum|total|price|date|created_at|updated_at|time|datetime|type|type_name|operation|kind|period|balance.*)$/i;
    return Object.entries(x).filter(([k, v]) => typeof v === "string" && v.trim() && !skip.test(k) && v.length < 80).map(([, v]) => v.trim()).slice(0, 4);
  }
  const first1 = (v) => (Array.isArray(v) ? v[0] : v);
  // real shape: data.{card, balance, transactions:[{transaction_time:"dd.mm.yyyy", sum:-70, type:"debit|credit", dop_info:[{name:[..],sum:[..],quantity:[..]}]}]}
  function parseCanteen(json) {
    const d = (json && json.data) || json || {};
    if (Array.isArray(d.transactions)) {
      const tx = d.transactions.map((t) => ({
        amount: Number(t.sum) || 0,
        dateObj: parseDate(t.transaction_time),
        date: String(t.transaction_time || ""),
        lines: (Array.isArray(t.dop_info) ? t.dop_info : []).map((it) => ({
          name: String(first1(it.name) || "").replace(/\\/g, "/"),
          qty: [first1(it.quantity), first1(it.sum)].filter((v) => v != null && v !== "").join(" × "),
        })),
        extra: [],
      }));
      return { card: d.card, balance: d.balance, tx };
    }
    return { card: d.card, balance: d.balance, tx: findTransactions(json) };
  }
  function findTransactions(json) {
    let best = [];
    (function walk(o, depth) {
      if (!o || depth > 6) return;
      if (Array.isArray(o)) {
        const objs = o.filter((x) => x && typeof x === "object");
        if (objs.length && objs.some((x) => pick(x, ["amount", "sum", "total", "price", "value"]) != null) && objs.length > best.length) {
          best = objs.map((x) => {
            let amt = Number(pick(x, ["amount", "sum", "total", "value", "price"]));
            const type = String(pick(x, ["type", "type_name", "operation", "kind"]) || "");
            if (!isNaN(amt) && /витрат|трат|spend|expense|debit|out/i.test(type) && amt > 0) amt = -amt;
            const raw = pick(x, ["date", "created_at", "time", "datetime", "period"]) || "";
            const pd = parseDate(raw) || (raw ? new Date(raw) : null);
            return {
              amount: isNaN(amt) ? 0 : amt,
              date: pd && !isNaN(pd) ? dmy(pd) : String(raw),
              lines: collectLines(x),
              extra: collectExtra(x),
            };
          });
        }
        o.forEach((x) => walk(x, depth + 1));
      } else if (typeof o === "object") for (const k in o) walk(o[k], depth + 1);
    })(json, 0);
    return best;
  }

  // ================= SCREEN: feed (notifications) =================
  async function feed(append) {
    const root = $("screen");
    if (!append) { root.innerHTML = ""; S.feedPage = 1; }
    let box = $("feedbox");
    if (!append) {
      const page = el("div", "page"); box = el("div", "list"); box.id = "feedbox";
      const back = el("button", "moreb", "← Назад"); back.style.cssText = "width:fit-content;padding:0 20px"; back.onclick = () => go(S.prevScreen || "diary");
      page.append(back, box, el("div", "spin")); page.lastChild.id = "feedspin"; root.appendChild(page);
    }
    let data;
    try { data = await api(`/feed?page=${S.feedPage}`); } catch (e) { $("feedspin") && $("feedspin").remove(); return errorBox(box.parentNode, e); }
    if (S.screen !== "feed") return;
    const sp = $("feedspin"); if (sp) sp.remove();
    const items = (data.data && data.data.items) || [];
    if (!items.length && !append) box.parentNode.appendChild(el("div", "msg", "Немає нових подій."));
    for (const it of items) {
      const r = el("div", "fi"); const b = el("div", "b");
      b.appendChild(el("div", "tm", it.time_formatted || ""));
      const title = plain(it.title); b.appendChild(el("div", "tt", title));
      const desc = plain(it.description); if (desc && desc !== title) b.appendChild(el("div", "ds", desc));
      r.appendChild(b);
      const gm = String(it.icon || "").match(/grades\/(\d+)/);
      if (gm) r.appendChild(gradeChip({ grade_value: gm[1] }));
      box.appendChild(r);
    }
    const old = $("feedmore"); if (old) old.remove();
    if (items.length) {
      const m = el("button", "moreb", "Показати ще"); m.id = "feedmore";
      m.onclick = () => { S.feedPage++; m.remove(); feed(true); };
      box.parentNode.appendChild(m);
    }
  }

  // ================= SCREEN: more =================
  function more() {
    const root = $("screen"); root.innerHTML = "";
    const page = el("div", "page"); root.appendChild(page);
    const me = el("div", "me");
    const nm = (S.profile && S.profile.student_name) || "";
    me.appendChild(el("div", "av", (nm.trim().split(/\s+/)[1] || nm || "?").charAt(0).toUpperCase()));
    const b = el("div"); b.append(el("b", null, nm), el("span", null, S.profile && S.profile.class_name ? `${S.profile.class_name} клас` : "")); me.appendChild(b);
    page.appendChild(me);
    // ----- appearance -----
    const look = el("div", "look"); look.appendChild(el("h3", null, "Вигляд"));
    const tbox = el("div"); tbox.appendChild(el("div", "lbl", "Тема"));
    const seg = el("div", "seg");
    [["auto", "Авто"], ["light", "Світла"], ["dark", "Темна"]].forEach(([k, t]) => {
      const b = el("button", getTheme() === k ? "on" : "", t);
      b.onclick = () => { lsSet("school_theme", k); applyTheme(); more(); };
      seg.appendChild(b);
    });
    tbox.appendChild(seg); look.appendChild(tbox);
    const cbox = el("div"); cbox.appendChild(el("div", "lbl", "Основний колір"));
    const sw = el("div", "sw");
    const cur = getAccent().toUpperCase();
    ACCENTS.forEach(([hex, name]) => {
      const b = el("button", cur === hex.toUpperCase() ? "on" : ""); b.style.background = hex; b.setAttribute("aria-label", name); b.title = name;
      b.onclick = () => { lsSet("school_accent", hex); applyTheme(); more(); };
      sw.appendChild(b);
    });
    const custom = el("label", ACCENTS.some(([h]) => h.toUpperCase() === cur) ? "" : "on"); custom.title = "Свій колір";
    const ci = document.createElement("input"); ci.type = "color"; ci.value = getAccent();
    ci.onchange = () => { lsSet("school_accent", ci.value.toUpperCase()); applyTheme(); more(); };
    custom.appendChild(ci); sw.appendChild(custom);
    cbox.appendChild(sw); look.appendChild(cbox);
    page.appendChild(look);

    const list = el("div", "list");
    const item = (icon, text, fn, chevron) => {
      const r = el("button", "mi"); const ic = el("span", "ic"); ic.appendChild(svg(icon));
      r.append(ic, el("span", "t", text));
      if (chevron) r.appendChild(svg(ICON.right));
      r.onclick = fn; list.appendChild(r);
    };
    const open = (path) => () => window.open(SCHOOL + path, "_blank", "noopener");
    item(ICON.mail, "Повідомлення", () => go("feed"));
    item(ICON.info, "Про нас", open("/static/common_information"), true);
    item(ICON.people, "Батькам", open("/static/pupils_rules"), true);
    item(ICON.book, "Підручники", open("/"), true);
    item(ICON.help, "Часті запитання", open("/"));
    page.appendChild(list);
    const dbg = el("button", "mi");
    const dic = el("span", "ic"); dic.appendChild(svg(ICON.info));
    dbg.append(dic, el("span", "t", "Скопіювати всі дані для розробника"));
    dbg.onclick = async () => {
      toast("Збираю дані…");
      const bundle = { app: "v8", profile: S.profile, studentId: S.studentId, weekMode: S.weekMode, weeks: {} };
      for (const [k, v] of S.weeks) bundle.weeks[new Date(k).toISOString().slice(0, 10)] = v;
      const grab = async (name, path) => { try { bundle[name] = await api(path); } catch (e) { bundle[name] = { error: String(e.message).slice(0, 500) }; } };
      try { await getWeek(Date.now()); bundle.weeks = Object.fromEntries([...S.weeks].map(([k, v]) => [new Date(k).toISOString().slice(0, 10), v])); } catch {}
      if (S.profile && S.profile.class_id) await grab("schoolSchedule", `/api?path=${encodeURIComponent("/schedule/class/get/" + S.profile.class_id)}`);
      const now = new Date(); const to = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
      await grab("canteen", `/api?path=${encodeURIComponent(`/canteen/get/${S.studentId}/${iso(new Date(to - 60 * DAY))}/${iso(new Date(to))}`)}`);
      await grab("feed", "/feed?page=1");
      copyText(JSON.stringify(bundle, null, 1));
    };
    list.appendChild(dbg);
    const out = el("button", "mi out"); const ic = el("span", "ic"); ic.appendChild(svg(ICON.out));
    out.append(ic, el("span", "t", "Вихід")); out.onclick = logout; page.appendChild(out);
  }

  // ================= router =================
  const TITLES = { diary: "Щоденник", schedule: "Розклад", grades: "Успішність", canteen: "Їдальня", more: "Ще", feed: "Повідомлення" };
  function go(screen) {
    if (screen === "feed") S.prevScreen = S.screen === "feed" ? S.prevScreen : S.screen;
    S.screen = screen;
    $("title").textContent = TITLES[screen]; $("title").classList.toggle("long", TITLES[screen].length > 10);
    document.querySelectorAll("#bn button").forEach((b) => b.classList.toggle("on", b.dataset.s === screen));
    window.scrollTo(0, 0);
    const run = { diary, schedule, grades, canteen, more, feed }[screen];
    Promise.resolve(run()).catch((e) => { const r = $("screen"); r.innerHTML = ""; errorBox(r, e); handleAuth(e); });
  }
  function handleAuth(e) {
    if (e && (e.status === 401) && /Unauthenticated|Missing X-Session/i.test(e.message)) {
      /* session expired: send back to login */
      logout("Сесія завершилась. Увійдіть знову.");
    }
  }

  // ================= login / logout =================
  const loginBtn = $("login-btn"), loginStatus = $("login-status");
  const workerInput = $("worker-url");
  workerInput.value = WORKER_URL === DEFAULT_WORKER_URL ? "" : WORKER_URL;
  function setStatus(msg, isErr) { loginStatus.textContent = msg; loginStatus.className = "st" + (isErr ? " error" : ""); }

  async function login() {
    const email = $("email").value.trim(), password = $("password").value;
    if (!email || !password) return setStatus("Заповніть усі поля.", true);
    const typed = workerInput.value.trim().replace(/\/+$/, "");
    if (typed) { WORKER_URL = typed; lsSet("school_worker_url", typed); }
    loginBtn.disabled = true; setStatus("Вхід...", false);
    try {
      const resp = await fetch(`${WORKER_URL}/login`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email, password, remember: $("remember").checked }) });
      const data = await resp.json();
      if (!resp.ok || !data.success) {
        setStatus((data.error || "Помилка входу.") + (data.debug_status ? "\n" + JSON.stringify(data, null, 1) : ""), true);
        loginBtn.disabled = false; return;
      }
      // a new login must never inherit the previous account's cached data
      S.profile = null; S.studentId = null; lsSet("school_student_id", ""); S.weeks.clear();
      setSession(data.session_cookie, $("remember").checked);
      $("password").value = "";
      start();
    } catch (err) { setStatus("Не вдалося з'єднатися з сервером: " + err.message, true); loginBtn.disabled = false; }
  }
  function logout(msg) {
    clearSession(); S.profile = null; S.studentId = null; lsSet("school_student_id", ""); S.weeks.clear();
    $("app-view").classList.add("hidden"); $("bn").classList.add("hidden"); $("login-view").classList.remove("hidden");
    loginBtn.disabled = false; setStatus(typeof msg === "string" ? msg : "", typeof msg === "string");
  }
  async function start() {
    $("login-view").classList.add("hidden");
    $("app-view").classList.remove("hidden"); $("bn").classList.remove("hidden");
    loading();
    try { await ensureProfile(); } catch (e) { const r = $("screen"); r.innerHTML = ""; errorBox(r, e); return handleAuth(e); }
    go(S.screen === "feed" ? "diary" : S.screen);
  }

  document.querySelectorAll("#bn button").forEach((b) => b.addEventListener("click", () => go(b.dataset.s)));
  $("bell").addEventListener("click", () => go("feed"));
  loginBtn.addEventListener("click", login);
  $("password").addEventListener("keydown", (e) => { if (e.key === "Enter") login(); });

  if (getSession()) start();
})();
</script>
</body>

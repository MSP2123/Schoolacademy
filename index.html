<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Щоденник — прототип</title>
<style>
  :root {
    --ink: #1c1f26;
    --paper: #fafaf8;
    --line: #dcdad4;
    --accent: #2f5d50;
    --accent-soft: #e4ede9;
    --muted: #6b6f76;
    --grade-low: #b5493a;
    --grade-mid: #b8862f;
    --grade-high: #2f5d50;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--paper);
    color: var(--ink);
    padding: 24px 16px 80px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 {
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 28px; }

  .card {
    background: white;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 16px;
  }

  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; margin-top: 14px; }
  label:first-child { margin-top: 0; }
  input[type="email"], input[type="password"], input[type="text"] {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    font-size: 15px;
    background: var(--paper);
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  .checkbox-row { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
  .checkbox-row label { margin: 0; font-size: 14px; color: var(--ink); }

  button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 6px;
    padding: 11px 18px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 18px;
    width: 100%;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  button:hover:not(:disabled) { filter: brightness(0.95); }

  .status { white-space: pre-wrap; word-break: break-all; font-size: 13px; margin-top: 10px; min-height: 18px; }
  .status.error { color: var(--grade-low); }
  .status.ok { color: var(--accent); }

  #app-view { display: none; }

  .day-block { margin-bottom: 22px; }
  .day-title { font-weight: 700; font-size: 15px; margin-bottom: 8px; }
  .lesson-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 8px 0;
    border-bottom: 1px solid var(--line);
    gap: 12px;
  }
  .lesson-row:last-child { border-bottom: none; }
  .lesson-name { font-size: 14px; }
  .lesson-comment { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .grades { display: flex; gap: 6px; flex-shrink: 0; }
  .grade-pill {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 24px;
    height: 24px;
    padding: 0 6px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 700;
    color: white;
  }

  .feed-item { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .feed-item:last-child { border-bottom: none; }
  .feed-time { font-size: 12px; color: var(--muted); }
  .feed-title { font-size: 14px; margin-top: 2px; }
  .feed-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .feed-desc { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .grade-pill.absent { background: #9a9fa8 !important; font-weight: 600; }

  .section-title { font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin: 24px 0 10px; }
  .logout-link { font-size: 13px; color: var(--muted); text-decoration: underline; cursor: pointer; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }

  .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .tab { flex: 1; text-align: center; padding: 9px 0; border: 1px solid var(--line); border-radius: 8px; background: white; font-size: 14px; font-weight: 600; cursor: pointer; color: var(--muted); }
  .tab.active { background: var(--accent); border-color: var(--accent); color: white; }
  .weeknav { display: flex; align-items: stretch; gap: 8px; margin-bottom: 14px; }
  .weeknav button { margin: 0; width: 44px; padding: 0; font-size: 18px; }
  .weeknav .week-label { flex: 1; display: flex; align-items: center; justify-content: center; background: white; border: 1px solid var(--line); border-radius: 6px; font-size: 14px; font-weight: 600; }
  .today-btn { margin: 0 0 14px; background: white; color: var(--accent); border: 1px solid var(--line); padding: 8px; font-size: 13px; }
  .day { background: white; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 14px; overflow: hidden; }
  .day-head { padding: 12px 16px; background: var(--accent-soft); display: flex; justify-content: space-between; align-items: baseline; }
  .day-head .dn { font-weight: 700; font-size: 15px; }
  .day-head .dd { font-size: 13px; color: var(--muted); }
  .day-empty { padding: 14px 16px; font-size: 13px; color: var(--muted); }
  .lesson { border-top: 1px solid var(--line); padding: 10px 16px; cursor: pointer; }
  .lesson:first-of-type { border-top: none; }
  .l-row { display: flex; gap: 12px; align-items: flex-start; }
  .l-num { width: 20px; flex-shrink: 0; font-weight: 700; color: var(--muted); font-size: 14px; padding-top: 1px; }
  .l-main { flex: 1; min-width: 0; }
  .l-subject { font-size: 15px; font-weight: 600; }
  .l-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .l-grades { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; max-width: 40%; }
  .g-item { display: flex; align-items: center; gap: 6px; }
  .g-type { font-size: 11px; color: var(--muted); text-align: right; }
  .hw-badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 4px; background: #fff3d6; color: #8a5b00; margin-left: 6px; vertical-align: middle; }
  .l-detail { display: none; margin: 8px 0 2px 32px; font-size: 13px; line-height: 1.45; }
  .lesson.open .l-detail { display: block; }
  .l-detail b { font-weight: 700; }
  .l-detail .blk { margin-top: 6px; white-space: pre-wrap; word-break: break-word; }
  .hw-item { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .hw-item:last-child { border-bottom: none; }
  .hw-subj { font-size: 14px; font-weight: 600; }
  .hw-text { font-size: 13px; margin-top: 3px; white-space: pre-wrap; word-break: break-word; }
  .hw-date { font-size: 12px; color: var(--muted); }
  .more-btn { background: white; color: var(--accent); border: 1px solid var(--line); }
  .debug-link { font-size: 12px; color: var(--muted); text-decoration: underline; cursor: pointer; display: inline-block; margin: 6px 0 24px; }
  pre.raw { background: #f2f1ec; padding: 10px; border-radius: 6px; font-size: 11px; white-space: pre-wrap; word-break: break-all; max-height: 300px; overflow: auto; }
</style>
</head>
<body>
<div class="wrap">

  <div id="login-view">
    <h1>Щоденник</h1>
    <div class="subtitle">Щоденник оцінок</div>
    <div class="card">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@example.com">

      <label for="password">Пароль</label>
      <input type="password" id="password">

      <div class="checkbox-row">
        <input type="checkbox" id="remember" checked>
        <label for="remember">Запам'ятати мене</label>
      </div>

      <details style="margin-top:14px;font-size:13px;color:var(--muted)">
        <summary>Налаштування сервера</summary>
        <label for="worker-url">Worker URL</label>
        <input type="text" id="worker-url" placeholder="https://school-proxy.xxx.workers.dev">
      </details>

      <button id="login-btn">Увійти</button>
      <div class="status" id="login-status"></div>
    </div>
  </div>

  <div id="app-view">
    <div class="top-bar">
      <h1 id="student-name">Щоденник</h1>
      <span class="logout-link" id="logout-btn">Вийти</span>
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="diary">Щоденник</div>
      <div class="tab" data-tab="homework">Домашні</div>
      <div class="tab" data-tab="feed">Стрічка</div>
    </div>

    <div id="tab-diary">
      <div class="weeknav">
        <button id="prev-week" aria-label="Попередній тиждень">‹</button>
        <div class="week-label" id="week-label">…</div>
        <button id="next-week" aria-label="Наступний тиждень">›</button>
      </div>
      <button class="today-btn" id="today-btn">Поточний тиждень</button>
      <div id="daybook-container"><div class="status">Завантаження...</div></div>
      <span class="debug-link" id="debug-link">Показати сирі дані (для налагодження)</span>
      <pre class="raw" id="raw" style="display:none"></pre>
    </div>

    <div id="tab-homework" style="display:none">
      <div class="section-title" style="margin-top:0">Домашнє завдання на цьому тижні</div>
      <div class="card" id="homework-container"></div>
    </div>

    <div id="tab-feed" style="display:none">
      <div class="card" id="feed-container"><div class="status">Завантаження...</div></div>
      <button class="more-btn" id="feed-more" style="display:none">Показати ще</button>
    </div>
  </div>

</div>

<script>
  // ---- config ----
  // Default Worker URL; can be overridden in-app (saved in localStorage) so no code edit is needed.
  const DEFAULT_WORKER_URL = "https://school-proxy.marksmurfik-d59.workers.dev";
  const lsGet = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
  let WORKER_URL = (lsGet("school_worker_url") || DEFAULT_WORKER_URL).replace(/\/+$/, "");
  const STORAGE_KEY_SESSION = "school_session_cookie";
  let STUDENT_ID = lsGet("school_student_id");

  const loginView = document.getElementById("login-view");
  const appView = document.getElementById("app-view");
  const emailInput = document.getElementById("email");
  const passwordInput = document.getElementById("password");
  const rememberInput = document.getElementById("remember");
  const loginBtn = document.getElementById("login-btn");
  const loginStatus = document.getElementById("login-status");
  const logoutBtn = document.getElementById("logout-btn");

  const workerInput = document.getElementById("worker-url");
  workerInput.value = WORKER_URL.includes("REPLACE-ME") ? "" : WORKER_URL;
  workerInput.addEventListener("change", () => {
    const v = workerInput.value.trim().replace(/\/+$/, "");
    if (v) { WORKER_URL = v; lsSet("school_worker_url", v); }
  });

  function getSession() {
    try { return localStorage.getItem(STORAGE_KEY_SESSION) || sessionStorage.getItem(STORAGE_KEY_SESSION); } catch { return null; }
  }
  function setSession(v, persist) {
    try {
      clearSession();
      (persist ? localStorage : sessionStorage).setItem(STORAGE_KEY_SESSION, v);
    } catch {}
  }
  function clearSession() {
    try { localStorage.removeItem(STORAGE_KEY_SESSION); sessionStorage.removeItem(STORAGE_KEY_SESSION); } catch {}
  }

  function setStatus(msg, isError) {
    loginStatus.textContent = msg;
    loginStatus.className = "status " + (isError ? "error" : "ok");
  }

  function gradeColor(value) {
    const n = parseInt(value, 10);
    if (isNaN(n)) return "var(--muted)";
    if (n <= 4) return "var(--grade-low)";
    if (n <= 7) return "var(--grade-mid)";
    return "var(--grade-high)";
  }

  async function login() {
    const email = emailInput.value.trim();
    const password = passwordInput.value;

    if (!email || !password) {
      setStatus("Заповніть усі поля.", true);
      return;
    }

    const typed = workerInput.value.trim().replace(/\/+$/, "");
    if (typed) { WORKER_URL = typed; lsSet("school_worker_url", typed); }
    if (WORKER_URL.includes("REPLACE-ME")) {
      setStatus("Вкажіть Worker URL у налаштуваннях сервера.", true);
      return;
    }

    loginBtn.disabled = true;
    setStatus("Вхід...", false);

    try {
      const resp = await fetch(`${WORKER_URL}/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password, remember: rememberInput.checked }),
      });
      const data = await resp.json();

      if (!resp.ok || !data.success) {
        setStatus((data.error || "Помилка входу.") + (data.debug_status ? "\n" + JSON.stringify(data, null, 1) : ""), true);
        loginBtn.disabled = false;
        return;
      }

      setSession(data.session_cookie, rememberInput.checked);
      showApp();
    } catch (err) {
      setStatus("Не вдалося з'єднатися з сервером: " + err.message, true);
      loginBtn.disabled = false;
    }
  }

  function logout() {
    clearSession();
    STUDENT_ID = null;
    lsSet("school_student_id", "");
    appView.style.display = "none";
    loginView.style.display = "block";
    loginBtn.disabled = false;
    setStatus("", false);
  }

  async function proxiedFetch(path, withHeaders) {
    const sessionCookie = getSession();
    const resp = await fetch(`${WORKER_URL}${path}`, {
      headers: { "X-Session-Cookie": sessionCookie || "" },
    });
    const data = await resp.json();
    if (!resp.ok) {
      throw new Error(JSON.stringify(data, null, 2));
    }
    return withHeaders ? { data, headers: resp.headers } : data;
  }

  // ---------- helpers ----------
  const DAY_MS = 86400000;
  const pick = (o, keys) => { for (const k of keys) if (o && o[k] != null && o[k] !== "") return o[k]; return null; };
  const plain = (h) => new DOMParser().parseFromString(String(h == null ? "" : h), "text/html").body.textContent.trim();
  function textOf(v) {
    if (v == null) return "";
    if (typeof v === "string") return plain(v);
    if (Array.isArray(v)) return v.map(textOf).filter(Boolean).join("\n");
    if (typeof v === "object") return textOf(pick(v, ["text", "description", "body", "value", "title", "name"]) ?? "");
    return String(v);
  }
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function showErr(id, msg) {
    const c = document.getElementById(id);
    c.innerHTML = "";
    const pre = el("pre", "status error", msg);
    pre.style.cssText = "white-space:pre-wrap;font-size:11px;";
    c.appendChild(pre);
  }
  function gradePill(value) {
    const pill = el("span", "grade-pill", value);
    const absent = /^н$/i.test(String(value).trim());
    pill.style.background = gradeColor(value);
    if (absent) { pill.classList.add("absent"); pill.title = "Відсутній"; }
    return pill;
  }

  // ---------- diary ----------
  let anchor = Date.now();          // any moment inside the week being viewed
  let weekMode = null;              // which week format the school accepted
  let lastWeekJson = null;
  let weekDays = [];

  function fmtShort(d) {
    return d.toLocaleDateString("uk-UA", { day: "numeric", month: "long" });
  }
  function parseDate(str) {          // "05.11.2026"
    const m = String(str || "").match(/(\d{1,2})\.(\d{1,2})\.(\d{4})/);
    return m ? new Date(Date.UTC(+m[3], +m[2] - 1, +m[1])) : null;
  }

  function lessonNumber(l, i) { return pick(l, ["lesson_number", "lesson_num", "number", "num", "order", "position"]) ?? i + 1; }
  function lessonTime(l) {
    const t = pick(l, ["time", "time_formatted", "period"]);
    if (t) return textOf(t);
    const a = pick(l, ["start_time", "time_start", "begin", "start", "from"]);
    const b = pick(l, ["end_time", "time_end", "end", "finish", "to"]);
    return a && b ? `${a} – ${b}` : a || "";
  }

  function renderDaybook(json) {
    lastWeekJson = json;
    const container = document.getElementById("daybook-container");
    weekDays = (json.data && json.data.week_days) || json.week_days || [];
    container.innerHTML = "";

    // header: real dates of the week we actually got
    const dates = weekDays.map((d) => parseDate(d.date)).filter(Boolean);
    document.getElementById("week-label").textContent = dates.length
      ? `${fmtShort(dates[0])} – ${fmtShort(dates[dates.length - 1])}`
      : "Тиждень";
    if (dates.length) anchor = dates[0].getTime() + 3 * DAY_MS;

    const name = pick(json.data || {}, ["student_name", "student", "user_name", "name"]);
    if (typeof name === "string") document.getElementById("student-name").textContent = name;

    if (!weekDays.length) {
      container.innerHTML = '<div class="status">На цей тиждень даних немає.</div>';
    }

    for (const day of weekDays) {
      const box = el("div", "day");
      const head = el("div", "day-head");
      head.appendChild(el("span", "dn", day.day_name || ""));
      head.appendChild(el("span", "dd", day.date || ""));
      box.appendChild(head);

      const lessons = day.lessons || [];
      if (!lessons.length) box.appendChild(el("div", "day-empty", "Уроків немає"));

      lessons.forEach((l, i) => {
        const row = el("div", "lesson");
        const top = el("div", "l-row");
        top.appendChild(el("div", "l-num", lessonNumber(l, i)));

        const main = el("div", "l-main");
        const subj = el("div", "l-subject", l.subject_name || "—");
        const hw = textOf(l.homework);
        if (hw) subj.appendChild(el("span", "hw-badge", "Д/з"));
        main.appendChild(subj);
        const meta = [lessonTime(l), pick(l, ["room", "class_room", "classroom", "cabinet"]), l.teacher_name].filter(Boolean).join(" · ");
        if (meta) main.appendChild(el("div", "l-meta", meta));
        top.appendChild(main);

        const gradesBox = el("div", "l-grades");
        for (const g of l.grades || []) {
          const item = el("div", "g-item");
          if (g.grade_type_name) item.appendChild(el("span", "g-type", g.grade_type_name));
          item.appendChild(gradePill(g.grade_value));
          gradesBox.appendChild(item);
        }
        top.appendChild(gradesBox);
        row.appendChild(top);

        const detail = el("div", "l-detail");
        const topic = textOf(l.topic);
        if (topic) { const b = el("div", "blk"); b.append(el("b", null, "Тема: "), topic); detail.appendChild(b); }
        if (hw) { const b = el("div", "blk"); b.append(el("b", null, "Домашнє завдання: "), hw); detail.appendChild(b); }
        for (const g of l.grades || []) {
          if (g.comment) { const b = el("div", "blk"); b.append(el("b", null, `Коментар (${g.grade_value}): `), plain(g.comment)); detail.appendChild(b); }
        }
        if (!detail.children.length) detail.appendChild(el("div", "blk", "Немає додаткових відомостей."));
        row.appendChild(detail);
        row.addEventListener("click", () => row.classList.toggle("open"));
        box.appendChild(row);
      });
      container.appendChild(box);
    }

    renderHomework();
    document.getElementById("raw").textContent = JSON.stringify(json, null, 1).slice(0, 6000);
  }

  function renderHomework() {
    const c = document.getElementById("homework-container");
    c.innerHTML = "";
    let n = 0;
    for (const day of weekDays) {
      for (const l of day.lessons || []) {
        const hw = textOf(l.homework);
        if (!hw) continue;
        n++;
        const item = el("div", "hw-item");
        item.appendChild(el("div", "hw-date", `${day.day_name || ""} ${day.date || ""}`.trim()));
        item.appendChild(el("div", "hw-subj", l.subject_name || ""));
        item.appendChild(el("div", "hw-text", hw));
        c.appendChild(item);
      }
    }
    if (!n) c.innerHTML = '<div class="status">На цьому тижні домашніх завдань немає.</div>';
  }

  async function loadWeek() {
    const c = document.getElementById("daybook-container");
    c.innerHTML = '<div class="status">Завантаження...</div>';
    try {
      const q = `/daybook?student_id=${STUDENT_ID}&date=${anchor}` + (weekMode ? `&mode=${weekMode}` : "");
      const { data, headers } = await proxiedFetch(q, true);
      const m = headers.get("X-Week-Mode");
      if (m && m !== "explicit") weekMode = m;
      renderDaybook(data);
    } catch (err) {
      showErr("daybook-container", err.message);
    }
  }

  // ---------- feed ----------
  let feedPage = 1;
  function renderFeed(json, append) {
    const container = document.getElementById("feed-container");
    const items = (json.data && json.data.items) || [];
    if (!append) container.innerHTML = "";
    if (!items.length && !append) {
      container.innerHTML = '<div class="status">Немає нових подій.</div>';
    }
    for (const item of items) {
      const box = el("div", "feed-item");
      box.appendChild(el("div", "feed-time", item.time_formatted || ""));
      const row = el("div", "feed-row");
      const left = el("div");
      const title = plain(item.title);
      left.appendChild(el("div", "feed-title", title));
      const desc = plain(item.description);
      if (desc && desc !== title) left.appendChild(el("div", "feed-desc", desc));
      row.appendChild(left);
      const gm = String(item.icon || "").match(/grades\/(\d+)/);
      if (gm) row.appendChild(gradePill(gm[1]));
      box.appendChild(row);
      container.appendChild(box);
    }
    document.getElementById("feed-more").style.display = items.length ? "block" : "none";
  }

  async function loadFeed(append) {
    try {
      const { data } = await proxiedFetch(`/feed?page=${feedPage}`, true);
      renderFeed(data, append);
    } catch (err) {
      showErr("feed-container", err.message);
    }
  }

  async function ensureIds() {
    if (STUDENT_ID) return;
    const { data: d } = await proxiedFetch("/discover", true);
    if (!d.current_student_id) {
      throw new Error("Не вдалося визначити учня автоматично.\n" + JSON.stringify(d, null, 1));
    }
    STUDENT_ID = d.current_student_id;
    lsSet("school_student_id", STUDENT_ID);
  }

  async function loadData() {
    try {
      await ensureIds();
    } catch (err) {
      showErr("daybook-container", err.message);
      return;
    }
    loadWeek();
    feedPage = 1;
    loadFeed(false);
  }

  function showApp() {
    loginView.style.display = "none";
    appView.style.display = "block";
    loadData();
  }

  document.querySelectorAll(".tab").forEach((t) => t.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach((x) => x.classList.toggle("active", x === t));
    for (const name of ["diary", "homework", "feed"]) {
      document.getElementById("tab-" + name).style.display = name === t.dataset.tab ? "block" : "none";
    }
  }));
  document.getElementById("prev-week").addEventListener("click", () => { anchor -= 7 * DAY_MS; loadWeek(); });
  document.getElementById("next-week").addEventListener("click", () => { anchor += 7 * DAY_MS; loadWeek(); });
  document.getElementById("today-btn").addEventListener("click", () => { anchor = Date.now(); loadWeek(); });
  document.getElementById("feed-more").addEventListener("click", () => { feedPage++; loadFeed(true); });
  document.getElementById("debug-link").addEventListener("click", () => {
    const r = document.getElementById("raw");
    r.style.display = r.style.display === "none" ? "block" : "none";
  });

  loginBtn.addEventListener("click", login);
  logoutBtn.addEventListener("click", logout);

  // auto-resume if a session is already stored from this browser tab
  if (getSession()) {
    showApp();
  }
</script>
</body>
</html>

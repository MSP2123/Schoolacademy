plugins {
    id 'com.android.application'
}

android {
    namespace 'ua.academy.school'
    compileSdk 34

    defaultConfig {
        applicationId 'ua.academy.school'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // The signing key is NOT stored in the repo: pass it via environment variables.
    signingConfigs {
        release {
            def ks = System.getenv('SCHOOL_KEYSTORE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('SCHOOL_KEYSTORE_PASSWORD')
                keyAlias System.getenv('SCHOOL_KEY_ALIAS') ?: 'school'
                keyPassword System.getenv('SCHOOL_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('SCHOOL_KEYSTORE')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
